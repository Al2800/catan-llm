name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          # Tokenizer/model stack for assistant-mask smoke (SmolLM — not 8B).
          # torch from the CPU wheel index; transformers must come from PyPI.
          uv pip install "torch" --index-url https://download.pytorch.org/whl/cpu
          uv pip install "transformers"

      - name: Ruff
        run: |
          source .venv/bin/activate
          ruff check src tests

      - name: Pytest (full)
        run: |
          source .venv/bin/activate
          pytest -q

      - name: Contract gate tests (explicit)
        run: |
          source .venv/bin/activate
          # Agents should see these fail red, not only in prose.
          # Skips: Qwen 8B one-batch until ticket 09 pins revision (clear skip message).
          pytest -q \
            tests/test_prompt_parity.py \
            tests/test_sim.py::test_mini_map_fail_loud_and_differs_from_base \
            tests/test_schema.py \
            tests/test_no_truncation.py \
            tests/test_teacher_pov.py \
            tests/test_assistant_mask.py \
            tests/test_seed_registry.py \
            tests/test_arena.py

      - name: Arena smoke
        run: |
          source .venv/bin/activate
          catan-arena --fixture bot-ladder --games 4 --vps 6 --no-alphabeta --out outputs/arena/ci.json
