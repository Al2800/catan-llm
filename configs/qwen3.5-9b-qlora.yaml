# Phase-2 QLoRA SFT sketch for Qwen3.5-9B.
# Normative intent: docs/SCOPE.md §7 Stage 1 + docs/ENV_BLACKWELL.md + DATA_CONTRACT §4.
#
# Hardware (2026-07-31): RTX 5060 Ti 16GB is NO-GO for train smoke.
# Run this config on a rental GPU (24–80GB class). See docs/reports/hw_smoke_5060ti.md.
# Never lower max_seq_length below 4096 to “fit” local VRAM.
#
# Model lock: Qwen/Qwen3.5-9B (Qwen3.5 has no dense 8B; Qwen3-8B-Instruct unresolvable).

model:
  name_or_path: Qwen/Qwen3.5-9B
  # Pinned after HF Jobs L40S rental smoke (ticket 09, 2026-07-31).
  revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
  trust_remote_code: true
  torch_dtype: bfloat16
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
    bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  # Adjust to Qwen3.5 module names if needed after inspection:
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  # Must be built from the canonical renderer (docs/DATA_CONTRACT.md v2).
  train_file: data/processed/expert-v1/train.jsonl
  val_file: data/processed/expert-v1/val.jsonl
  # Measured canonical prompts are ~2.3–2.5k tokens before the assistant label.
  # 2048 with keep_start truncation would cut the JSON label — do not lower below 4096.
  # 4096 is a label-safety floor; T8 must prove VRAM on the 5060 Ti with the pinned revision.
  max_seq_length: 4096
  packing: false
  require_schema_version: v2

train:
  output_dir: outputs/sft/qwen3.5-9b-qlora
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 200
  save_steps: 200
  save_total_limit: 3
  report_to: none
  # TRL / SFTTrainer — assistant tokens only (do not also enable completion_only_loss).
  assistant_only_loss: true

eval_after_train:
  protocol: docs/EVAL_PROTOCOL.md
  fixture: ladder-4p
  seed_range_name: ladder_sft_gate
  games: 200
  vps_to_win: 10
  fallback_policy: first_legal

hardware_budget:
  device: cuda:0
  target_peak_vram_gb: 14
  abort_if_oom: true
